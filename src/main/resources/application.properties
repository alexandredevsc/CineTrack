# Nome da aplicação
spring.application.name=CineTrack

# Endereço do banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinetrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}

# Usuário do MySQL
spring.datasource.username=${DB_USERNAME:root}

# Senha recebida por uma variável de ambiente.
# O valor após os dois-pontos é o padrão vazio.
spring.datasource.password=${DB_PASSWORD:root}

# Atualiza as tabelas com base nas entidades Java
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no terminal
spring.jpa.show-sql=true

# Formata os comandos SQL para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Evita cache das páginas durante o desenvolvimento
spring.thymeleaf.cache=false

# Token utilizado para autenticar as requisições ao TMDB.
# O valor verdadeiro fica em uma variável de ambiente, fora do GitHub.
tmdb.api.token=${TMDB_API_TOKEN:}

# Endereço principal da API do TMDB.
tmdb.api.base-url=https://api.themoviedb.org/3

# Endereço usado para montar a URL das capas.
# w342 limita a largura da imagem e evita arquivos excessivamente grandes.
tmdb.image.base-url=https://image.tmdb.org/t/p/w342

# Aguarda 30 segundos após iniciar a aplicação
# antes da primeira tentativa de atualizar capas pendentes.
tmdb.covers.initial-delay-ms=30000

# Aguarda 5 minutos entre as tentativas automáticas.
# O valor é informado em milissegundos.
tmdb.covers.refresh-delay-ms=300000